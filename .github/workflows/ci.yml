name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.x"
  # Keep in sync with GOLANGCI_LINT_VERSION in the Makefile.
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: |
            go.mod
            go.sum

      # Fyne's GLFW driver needs these to compile on Linux (GLFW 3.4 builds
      # both its X11 and Wayland backends); UI tests run with Fyne's headless
      # test driver, so no display server is needed.
      - name: Install Fyne system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        run: make test-race

      - name: Test without CGo outside the CGo edge
        run: make test-nocgo

      - name: Build
        run: |
          make build
          ./goscriber --version

  # Builds the pinned NeMo-Speech.cpp SDK (Metal on macOS, CPU on Linux), caches
  # it, and checks the CGo binding against it. docs/engine-sdk.md has the details.
  engine:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # A cached SDK may be restored on a runner with another CPU model, so
      # build portable CPU code rather than tuning ggml for the build machine.
      NEMO_SPEECH_CMAKE_ARGS: -DGGML_NATIVE=OFF
      PKG_CONFIG_PATH: ${{ github.workspace }}/.deps/nemo-speech/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: |
            go.mod
            go.sum

      # The build stamp names the pinned commit, platform, preset and CMake
      # options, so changing any of them builds a fresh SDK. ImageOS keeps a
      # runner image upgrade from reusing an SDK built on the old image.
      - name: Compute the SDK cache key
        id: sdk
        run: echo "key=nemo-speech-${ImageOS}-${{ runner.arch }}-$(scripts/build-nemo-speech.sh --stamp | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

      - name: Restore the SDK
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: .deps/nemo-speech
          key: ${{ steps.sdk.outputs.key }}

      # pkg-config links the binding; Ninja (with the runner's CMake) builds the
      # SDK, so it is only needed on a cache miss.
      - name: Install the build tools
        env:
          SDK_CACHED: ${{ steps.restore.outputs.cache-hit }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export HOMEBREW_NO_AUTO_UPDATE=1
            command -v pkg-config >/dev/null || brew install pkgconf
            [ "$SDK_CACHED" = true ] || command -v ninja >/dev/null || brew install ninja
          elif [ "$SDK_CACHED" != true ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build pkg-config
          fi

      # With a restored SDK this only confirms the stamp and refreshes the
      # pkg-config file.
      - name: Build the SDK
        run: make deps

      - name: Save the SDK
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .deps/nemo-speech
          key: ${{ steps.sdk.outputs.key }}

      - name: Lint the binding
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags=nemo ./internal/engine/nemo/...

      - name: Vet and test the binding
        run: make test-engine

      - name: Print the engine version through CGo
        run: |
          got="$(make --no-print-directory engine-version)"
          want="$(pkg-config --modversion nemo-speech-asr)"
          echo "nemo_speech_asr_version() reports $got; the SDK is $want"
          test "$got" = "$want"
